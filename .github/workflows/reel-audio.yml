name: Reel audio

on:
  push:
    branches: [main]
    paths: ["reels/**/spec.json", "voices/requests.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reel-audio
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Add music and voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/build_reels.py

      - name: Commit finished reels
        run: |
          git config user.name "akita-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reels voices
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "Add music to reels [skip ci]"
            git push
          fi
