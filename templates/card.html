<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{font-family:"Inter",sans-serif;position:relative}
body.dark{--bg1:#1A3352;--bg2:#1E3A5F;--bg3:#21436C;--ink:#FFFFFF;--acc:#6DB6E6;--eye:#8CC4E8;--muted:#C9D6E3;--grid:rgba(255,255,255,.045);--glow:rgba(46,134,193,.35)}
body.light{--bg1:#F4F6F8;--bg2:#EEF2F6;--bg3:#E6ECF2;--ink:#1E3A5F;--acc:#2E86C1;--eye:#2E86C1;--muted:#5B6B7E;--grid:rgba(30,58,95,.06);--glow:rgba(46,134,193,.14)}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 88% 8%,var(--glow),transparent 70%),linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%)}
.grid{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 72px),repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 72px)}
.inner{position:absolute;inset:104px 96px 96px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.eyebrow{font-size:26px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--eye)}
.rule{width:72px;height:6px;background:#2E86C1;margin-bottom:36px}
h1{font-family:"Inter Display","Inter",sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.08;font-size:92px}
h1 .l2{display:block;color:var(--acc);margin-top:18px}
.foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:28px;color:var(--muted);font-weight:500}
.foot b{color:var(--ink);font-weight:800;letter-spacing:.06em;font-size:34px}
</style></head><body class="{{THEME}}"><div class="bg"></div><div class="grid"></div>
<div class="inner"><div class="eyebrow">{{EYEBROW}}</div>
<div><div class="rule"></div><h1>{{L1}}<span class="l2">{{L2}}</span></h1></div>
<div class="foot"><b>AKITA</b><span>akitasales.com</span></div></div></body></html>
